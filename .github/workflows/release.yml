name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - run: go test -count=1 ./...
      - run: make dist VERSION=${{ github.ref_name }}

      # Stable, version-less names so install.sh can use /releases/latest/download.
      - name: Add version-less aliases
        run: |
          cd dist
          for f in watchcat-agent_${{ github.ref_name }}_*; do
            [ "$f" = "SHA256SUMS" ] && continue
            cp "$f" "$(echo "$f" | sed 's/_${{ github.ref_name }}_/_/')"
          done
          shasum -a 256 watchcat-agent_* > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
